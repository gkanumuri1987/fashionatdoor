# Yoga dictums — keyed by the exact yoga keys emitted by jyotish/yogas.py
# (prefix keys like mahapurusha_* and neecha_bhanga_* are matched by prefix).

mahapurusha_ruchaka: {source: "BPHS 75", dictum: "Ruchaka (Mars mahapurusha): courage as character — a commander's frame, wins through direct action; must guard against ruling by force at home."}
mahapurusha_bhadra:  {source: "BPHS 75", dictum: "Bhadra (Mercury mahapurusha): intellect as character — eloquent, long-remembered for words and wit; the mind is the fortune."}
mahapurusha_hamsa:   {source: "BPHS 75", dictum: "Hamsa (Jupiter mahapurusha): wisdom as character — respected as a guide, swan-like discrimination between milk and water."}
mahapurusha_malavya: {source: "BPHS 75", dictum: "Malavya (Venus mahapurusha): grace as character — beauty, comfort, artistic power, magnetic ease; pleasure must not become the master."}
mahapurusha_sasa:    {source: "BPHS 75", dictum: "Sasa (Saturn mahapurusha): discipline as character — authority over structures and people, rises through patience to command."}
gajakesari:          {source: "BPHS 36", dictum: "Gajakesari (Jupiter in kendra from Moon): the elephant-lion pairing — intelligence with emotional strength; reputation endures and grows in later life."}
budhaditya:          {source: "Standard nabhasa texts", dictum: "Budhaditya (Sun-Mercury union): the illuminated intellect — administrative and scholarly skill; combustion distance decides its purity."}
chandra_mangala:     {source: "Classical dhana texts", dictum: "Chandra-Mangala: feeling fused with drive — earning power and enterprise, with a temper the wallet must forgive."}
kemadruma:           {source: "BPHS 36", dictum: "Kemadruma (unsupported Moon): emotional self-reliance learned the hard way; classical hardship of loneliness, softened by kendra support and devotion — a call toward inner anchoring."}
raja_kendra_trikona: {source: "BPHS 39", dictum: "Raja yoga (kendra-trikona lords united): duty and fortune shake hands — position, influence, and responsibility rise together."}
vipareeta_raja:      {source: "BPHS 39; Phaladeepika 6", dictum: "Vipareeta Raja (dusthana lords in dusthana): gains born from others' crises and from what collapses — success arrives through reversals that would break others."}
dhana_2_11:          {source: "Classical dhana yoga texts", dictum: "Dhana yoga (2nd-11th lords united): the earning and the keeping cooperate — wealth accumulates once effort is consistent."}
neecha_bhanga:       {source: "Phaladeepika 7", dictum: "Neecha Bhanga: the fallen planet raised — early weakness in this graha's domain converts to unusual strength; the classical rags-to-honor signature."}
viparita_harsha:     {source: "BPHS 39", dictum: "Harsha (6th lord in dusthana): enemies and illnesses lose their grip — health and victory over rivals improve with age; courage from surviving early friction."}
viparita_sarala:     {source: "BPHS 39", dictum: "Sarala (8th lord in dusthana): fearlessness before crisis — depth, research, and longevity; what terrifies others becomes familiar ground."}
viparita_vimala:     {source: "BPHS 39", dictum: "Vimala (12th lord in dusthana): expenses turn frugal and losses turn clean — independence, contentment, and a reputation for integrity."}
sunapha:             {source: "BPHS 36", dictum: "Sunapha (planet 2nd from Moon): self-earned property and a mind that builds on its feelings — intelligent, wealthy by own effort, quietly reputed."}
anapha:              {source: "BPHS 36", dictum: "Anapha (planet 12th from Moon): well-formed body and renounced polish — generous, famed, comfortable, with a late-life turn toward simplicity."}
durudhara:           {source: "BPHS 36", dictum: "Durudhara (Moon flanked both sides): resources flow from both directions — vehicles, comforts, and helpful people; generosity returns as security."}
vesi:                {source: "BPHS 36", dictum: "Vesi (planet 2nd from Sun): truthful, tall-standing, balanced effort — fortune follows visible work."}
vasi:                {source: "BPHS 36", dictum: "Vasi (planet 12th from Sun): skillful, charitable, strong memory — quiet influence near power."}
ubhayachari:         {source: "BPHS 36", dictum: "Ubhayachari (Sun flanked both sides): a king's gait — resources and allies on both flanks, well-liked and well-provided."}
adhi:                {source: "BPHS 36", dictum: "Adhi (benefics in 6/7/8 from Moon): ministers around the throne of the mind — leadership, health, and defeat of opposition; polished conduct opens doors."}
amala:               {source: "Phaladeepika 6", dictum: "Amala (benefic in the 10th): a spotless flag — career earns lasting respect; reputation is the wealth to protect."}
kala_sarpa:          {source: "Jyotisha tradition (post-classical)", dictum: "Kala Sarpa (all grahas within the nodal axis): a fated intensity — life moves in dramatic chapters with karmic urgency; devotion and patience convert pressure into rare achievement. Judged softly: many great charts carry it."}
guru_chandala:       {source: "Jataka tradition", dictum: "Guru-Chandala (Jupiter with a node): the teacher meets the outsider — unconventional beliefs, brilliance outside orthodoxy; needs an honest guru and honest doubt."}
grahan:              {source: "Jataka tradition", dictum: "Grahan yoga (luminary with a node): an eclipse imprint on the Sun/Moon principle — identity or mind experiences periodic shadowing; remedial devotion to the luminary steadies it."}
saraswati:           {source: "Phaladeepika 6", dictum: "Saraswati (Jupiter, Venus, Mercury well-placed): the goddess of learning presides — eloquence, arts, scholarship, and renown through knowledge."}
lakshmi:             {source: "Phaladeepika 6", dictum: "Lakshmi (dignified 9th lord in kendra/trikona): fortune's own lord seated in strength — prosperity, virtue, and grace that grows with dharma."}
parivartana_maha:    {source: "Classical parivartana texts", dictum: "Maha Parivartana (benefic-house exchange): two lords trade homes and both prosper — cooperation between those life areas multiplies results."}
parivartana_khala:   {source: "Classical parivartana texts", dictum: "Khala Parivartana (3rd-house exchange): uneven fortunes — bold effort alternates between windfall and setback; discipline evens the swings."}
parivartana_dainya:  {source: "Classical parivartana texts", dictum: "Dainya Parivartana (dusthana exchange): struggle-laced exchange — obstacles entangle the two areas, yet perseverance converts debt into mastery."}
