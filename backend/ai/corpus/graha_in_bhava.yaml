# Graha-in-bhava dictums — freshly paraphrased condensations of the classical
# placement results (BPHS bhava chapters; Phaladeepika ch. 8; Saravali).
# Keyed graha -> house (1-12). One disciplined line each; dignity and aspects
# modulate these — the reading prompt is told to weigh them together.

sun:
  1:  "Self-defined, dignified, vitality strong; the person is seen — and knows it. (Phaladeepika 8)"
  2:  "Speech carries authority; family wealth fluctuates with pride; guard the eyes and diet. (Saravali)"
  3:  "Courage shines; siblings respect or rival; short efforts win recognition. (BPHS)"
  4:  "Heart seeks honor at home; friction with mother or homeland possible; property through own effort. (Saravali)"
  5:  "Intelligence commands; children few but notable; creative authority. (Phaladeepika 8)"
  6:  "Enemies burn away before persistence; service fields reward; health improves with discipline. (BPHS)"
  7:  "Partner is proud or prominent; marriage tests ego; business with authority figures. (Saravali)"
  8:  "Longevity themes; inheritance entangled with authority; interest in the hidden. (Saravali)"
  9:  "Father is pivotal; dharma is personal honor; fortune through principled action. (BPHS)"
  10: "Career is the stage — leadership, government, visibility; the classical dig-bala Sun. (Phaladeepika 8)"
  11: "Gains through authority and elders; influential circles; ambitions realized in maturity. (Saravali)"
  12: "Authority spent in solitude or abroad; expenditure for status; spiritual light in retreat. (BPHS)"
moon:
  1:  "Charm and changefulness at the front door; public life suits; feelings show on the face. (Phaladeepika 8)"
  2:  "Wealth flows and ebbs; sweet speech; family of women influential. (Saravali)"
  3:  "Emotional courage; close bonds with siblings; writing or messaging talent. (BPHS)"
  4:  "Strong dig-bala: comfort, mother, vehicles, inner peace when home is right. (BPHS)"
  5:  "Romantic imagination; loved by children and students; creative moods. (Saravali)"
  6:  "Feelings drawn into service or health matters; emotional eating; wins by caring for enemies. (Saravali)"
  7:  "Partner-focused heart; popularity in dealings; moods mirror the spouse. (Phaladeepika 8)"
  8:  "Deep emotional currents; psychic sensitivity; mother's health a theme. (Saravali)"
  9:  "Devotional heart; fortune through mother's line or public favor; pilgrimages nourish. (BPHS)"
  10: "Career serves the public — care, food, water, homes; reputation waxes and wanes. (Saravali)"
  11: "Gains through networks and women; many friendships; wishes ripen steadily. (Saravali)"
  12: "Inward tides; comfort in solitude or foreign shores; dreams vivid; rest is medicine. (BPHS)"
mars:
  1:  "Drive stamped on the body; scars or marks; leads with heat — patience is the practice. (Phaladeepika 8)"
  2:  "Sharp speech; spends fast; family disputes over assets possible. (Saravali)"
  3:  "Classic strong seat: courage, victorious siblings' bond or rivalry, technical daring. (BPHS)"
  4:  "Heat at home; property through contest; mother's peace needs protection. (Saravali)"
  5:  "Bold creativity; children spirited; speculation tempts — discipline it. (Saravali)"
  6:  "Dig-bala house of victory: enemies crushed, service through engineering/protection, robust recovery. (BPHS)"
  7:  "Partner strong-willed; the classical kuja-dosha seat — marriage needs maturity, not fear. (BPHS)"
  8:  "Crisis strength; surgical themes; sudden events teach control of force. (Saravali)"
  9:  "Fights for beliefs; dharma of the warrior; father-relations energetic. (Saravali)"
  10: "Executes; engineering, command, land; ambition needs an honorable target. (Phaladeepika 8)"
  11: "Gains through bold ventures and brothers-in-arms; income in bursts. (Saravali)"
  12: "Energy leaks without a cause; hidden conflicts; best spent in ashram-like discipline abroad. (BPHS)"
mercury:
  1:  "Wit at the front; youthful look; speaks before the world thinks. (Phaladeepika 8)"
  2:  "Earns by words and numbers; family of traders or scholars; pleasant voice. (Saravali)"
  3:  "Writing, commerce, siblings close; hands skilled; many short journeys. (BPHS)"
  4:  "Educated home; vehicles and documents; learning from the mother-line. (Saravali)"
  5:  "The scholar's seat: intelligence celebrated, students and children bright, mantra aptitude. (BPHS)"
  6:  "Analysis serves health and disputes; wins arguments; nervous strain is the tax. (Saravali)"
  7:  "Partner clever and younger in spirit; business partnerships favored. (Saravali)"
  8:  "Research mind; secrets, accounts of others; longevity classically good here. (Saravali)"
  9:  "Learned in shastra; travels for study; teacher-merchant blend. (BPHS)"
  10: "Career in communication, trade, accounts, counsel; adaptable reputation. (Phaladeepika 8)"
  11: "Gains through networks, writing, many streams; friends of all ages. (Saravali)"
  12: "Imagination inward; research in seclusion; guard against anxious overthinking. (BPHS)"
jupiter:
  1:  "Graceful presence, optimism, respect; protection in life's storms; weight gain classical. (Phaladeepika 8)"
  2:  "Wealth and eloquent speech; family values; feeds others. (BPHS)"
  3:  "Wisdom shared with siblings; publishing; effort guided by ethics. (Saravali)"
  4:  "Blessed home; vehicles, comfort, mother's virtue; happiness classical here. (BPHS)"
  5:  "Purva-punya shines: children, wisdom, mantra-shakti, honored intelligence. (BPHS)"
  6:  "Serves through counsel; enemies dissolve by fairness; watch liver and sugar. (Saravali)"
  7:  "Noble partner; marriage as dharma; counsel sought by many. (BPHS)"
  8:  "Inheritance, depth in shastra of the hidden; longevity favored. (Saravali)"
  9:  "Strongest seat: dharma, guru's grace, fortune, father's blessing. (BPHS)"
  10: "Career as teacher, advisor, judge; reputation for probity. (Phaladeepika 8)"
  11: "Gains ample and clean; elder mentors; wishes fulfilled in season. (Saravali)"
  12: "Generosity in secret; moksha-inclination; spends on the sacred; sleep blessed. (BPHS)"
venus:
  1:  "Beauty and charm; attracts ease; refinement in dress and manner. (Phaladeepika 8)"
  2:  "Wealth through arts and taste; sweet family speech; loves good food. (Saravali)"
  3:  "Artistic siblings; graceful efforts; music in the hands. (Saravali)"
  4:  "Vehicles, lovely home, mother's affection; comforts accumulate. (BPHS)"
  5:  "Romance and creativity; artistic children; love affairs classical. (Saravali)"
  6:  "Love entangled with service; workplace attractions; sugar and kidneys need care. (Saravali)"
  7:  "Dig-bala seat of marriage: attractive partner, harmony sought, business in luxury goods. (BPHS)"
  8:  "Partner's wealth; hidden pleasures; transformation through relationship. (Saravali)"
  9:  "Fortune through grace and art; devoted to beauty in dharma; blessed travels. (BPHS)"
  10: "Career in arts, luxury, diplomacy, entertainment; liked by superiors. (Phaladeepika 8)"
  11: "Gains through women, arts, refined circles; desires fulfilled. (Saravali)"
  12: "Bed-comforts and foreign pleasures; the classical strong Venus for moksha through love. (BPHS)"
saturn:
  1:  "Gravity in the body and manner; slow start, durable finish; health needs warmth and routine. (Phaladeepika 8)"
  2:  "Earns late but keeps; frugal speech; family duty heavy. (Saravali)"
  3:  "Disciplined effort; few but tested siblings; endurance in craft. (BPHS)"
  4:  "Austere home; distance from mother or homeland; property late and solid. (Saravali)"
  5:  "Sober intellect; children delayed or serious; learns by structure. (Saravali)"
  6:  "Excellent seat: outworks enemies and illness; service organizations; the marathon winner. (BPHS)"
  7:  "Mature or older partner; marriage as long contract; loyalty over romance. (BPHS)"
  8:  "Classical longevity seat; slow inheritances; wisdom through austerity. (BPHS)"
  9:  "Dharma of discipline; questions the guru before trusting; fortune ripens late. (Saravali)"
  10: "Career mountain climbed step by step; institutions, land, iron, labor; lasting name. (Phaladeepika 8)"
  11: "Gains steady and cumulative; elder friends; the compound-interest house. (BPHS)"
  12: "Solitude natural; expenses controlled or life abroad; moksha through renunciation of hurry. (BPHS)"
rahu:
  1:  "Unconventional identity; foreign flavor; hungers to be extraordinary — and can be. (Saravali)"
  2:  "Unusual income streams; speech electric or exaggerated; family of mixed traditions. (Saravali)"
  3:  "Daring beyond siblings; media and technology suit; bold communication. (Saravali)"
  4:  "Restless home; foreign residence classical; unusual mother-story. (Saravali)"
  5:  "Unorthodox intelligence; speculative pull; children's path unusual. (Saravali)"
  6:  "Devours enemies and disease; excels in competition; the classical Rahu victory seat. (Saravali)"
  7:  "Foreign or unconventional partner; magnetic dealings; contracts need care. (Saravali)"
  8:  "Fascination with the hidden; sudden gains and losses; occult research. (Saravali)"
  9:  "Questions tradition; foreign dharma; the guru tested. (Saravali)"
  10: "Massive career hunger; fame possible in new fields; ethics decide the ending. (Saravali)"
  11: "The classical gains seat: large networks, large income, larger appetite. (Saravali)"
  12: "Foreign lands, isolation, moksha through surrendering the last craving. (Saravali)"
ketu:
  1:  "Elusive self-image; spiritual detachment early; the body forgets itself. (Saravali)"
  2:  "Detached from accumulation; speech terse or mystical; family thread cut somewhere. (Saravali)"
  3:  "Effort without display; courage sudden; sibling distance. (Saravali)"
  4:  "Wandering roots; home found within; mother-thread karmic. (Saravali)"
  5:  "Intuitive intellect; past-life learning surfaces; children's bond karmic. (Saravali)"
  6:  "Quietly dissolves enemies; healing gifts; service unseen. (Saravali)"
  7:  "Detachment in partnership; spouse spiritual or distant; union teaches release. (Saravali)"
  8:  "The mystic's seat: moksha-research, sudden insight, fearlessness about endings. (Saravali)"
  9:  "Doubts inherited dharma to find real dharma; pilgrim's flag. (Saravali)"
  10: "Career indifference despite talent; works best behind the curtain. (Saravali)"
  11: "Gains released as they come; friends few and karmic. (Saravali)"
  12: "Strongest moksha seat: meditation, liberation-current, sleep full of teaching. (Saravali)"
